rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration has no actions.
  appropriate-polling:
    status: done
    comment: Every 2 minutes; the city feeds update at that cadence or slower.
  brands: done
  common-modules:
    status: done
    comment: sources.py (one adapter per city), coordinator.py and device.py hold the shared pieces.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements beyond Home Assistant's own aiohttp.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: The entry's coordinator is entry.runtime_data.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: One entry per city.

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: todo
  reauthentication-flow:
    status: exempt
    comment: The open feeds need no credentials.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Web services, nothing on the network to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: No devices; the README lists the supported cities.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per city; car parks are entities and map markers.
  entity-category:
    status: exempt
    comment: Every entity is a primary reading (free spaces, map marker); none is configuration or diagnostic.
  entity-device-class:
    status: exempt
    comment: Free parking spaces have no matching sensor device class.
  entity-disabled-by-default: todo
  entity-translations:
    status: exempt
    comment: Every entity is named after its car park as the city's feed spells it; the device name and the status attribute are translated.
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow:
    status: exempt
    comment: An entry is one city with no further settings.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: todo
